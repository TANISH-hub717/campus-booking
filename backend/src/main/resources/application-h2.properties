# ===================================================================
# In-Memory H2 Profile (Fast dev & automated evaluation without local PostgreSQL service)
# Run with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# ===================================================================
spring.datasource.url=jdbc:h2:mem:campus_booking_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app}

# Default Bootstrap Admin for immediate dev/test
app.admin.bootstrap.enabled=true
app.admin.bootstrap.email=admin@campus.edu
app.admin.bootstrap.password=Admin@123
app.admin.bootstrap.name=Campus Administrator
app.admin.bootstrap.staff-id=ADM-001

